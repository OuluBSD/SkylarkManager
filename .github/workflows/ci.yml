name: SkylarkManager CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-posix:
    name: POSIX (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang++
            bm: CLANG
          - os: ubuntu-latest
            compiler: g++
            bm: GCC
          - os: macos-latest
            compiler: clang++
            bm: CLANG_macOS

    steps:
      - name: Checkout SkylarkManager
        uses: actions/checkout@v4
        with:
          path: SkylarkManager

      - name: Checkout BazaarCore
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/BazaarCore
          path: BazaarCore

      - name: Checkout UppBootstrap
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBootstrap
          path: UppBootstrap

      - name: Checkout UppBuilder
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBuilder
          path: UppBuilder

      - name: Checkout CompanySkylark (Company composed module)
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/CompanySkylark
          path: CompanySkylark

      - name: Checkout SuperIntelligence
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/SuperIntelligence
          path: SuperIntelligence

      - name: Checkout Upstream U++ (ultimatepp)
        uses: actions/checkout@v4
        with:
          repository: ultimatepp/ultimatepp
          path: ultimatepp
          sparse-checkout: |
            mkumk_blitz.cpp
            Makefile
            uppsrc/**
          sparse-checkout-cone-mode: false

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang g++ libbz2-dev libexpat1-dev libfontconfig1-dev libfreetype-dev liblz4-dev liblzma-dev libpcre2-dev libpng-dev libjpeg-dev libssl-dev libx11-dev libxcb1-dev libxxhash-dev libzstd-dev zlib1g-dev libgtk-3-dev libnotify-dev

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 libpng lz4 pcre2 xxhash zstd xz bzip2
          echo "CPATH=/opt/homebrew/include:/opt/homebrew/opt/openssl@3/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=/opt/homebrew/lib:/opt/homebrew/opt/openssl@3/lib" >> "$GITHUB_ENV"

      - name: Bootstrap umk with UppBootstrap
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cd UppBootstrap
          chmod +x ./bootstrap.sh
          ./bootstrap.sh --upp-root "$GITHUB_WORKSPACE/ultimatepp" --verbose
          echo "$GITHUB_WORKSPACE/ultimatepp/bin" >> "$GITHUB_PATH"

      - name: Bootstrap UppBuilder
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cd UppBuilder
          chmod +x ./bootstrap.sh
          ./bootstrap.sh
          echo "$GITHUB_WORKSPACE/UppBuilder" >> "$GITHUB_PATH"

      - name: Verify umk and UppBuilder
        run: |
          umk
          uppbuilder --version
          uppbuilder --help

      - name: Materialize Patched BazaarCore Assembly
        run: |
          cd BazaarCore
          uppbuilder --apply-patches --upstream "$GITHUB_WORKSPACE/ultimatepp/uppsrc" --applied-patches "$GITHUB_WORKSPACE/BazaarCore/patched-uppsrc" -v

      - name: Build ManagerSkylark (${{ matrix.bm }})
        run: |
          cd SkylarkManager
          uppbuilder ManagerSkylark -m ${{ matrix.bm }} -a ../CompanySkylark/uppsrc -v

      - name: Verify ManagerSkylark Binary
        run: |
          test -f SkylarkManager/bin/ManagerSkylark
          ls -lh SkylarkManager/bin/ManagerSkylark
          file SkylarkManager/bin/ManagerSkylark

      - name: Run Automated ManagerSkylark Tests
        run: |
          cd SkylarkManager
          ./bin/ManagerSkylark --test

      - name: Build SkylarkGuiExample (${{ matrix.bm }})
        run: |
          cd SkylarkManager
          uppbuilder examples/SkylarkGuiExample -m ${{ matrix.bm }} -v

      - name: Verify SkylarkGuiExample Binary
        run: |
          test -f SkylarkManager/bin/SkylarkGuiExample
          ls -lh SkylarkManager/bin/SkylarkGuiExample
          file SkylarkManager/bin/SkylarkGuiExample

      - name: Build WebShowcase (${{ matrix.bm }})
        run: |
          cd SkylarkManager
          uppbuilder examples/WebShowcase -m ${{ matrix.bm }} -v

      - name: Verify WebShowcase Binary
        run: |
          test -f SkylarkManager/bin/WebShowcase
          ls -lh SkylarkManager/bin/WebShowcase
          file SkylarkManager/bin/WebShowcase

      - name: Build WebEngineTests (${{ matrix.bm }})
        run: |
          cd SkylarkManager
          uppbuilder WebEngineTests -m ${{ matrix.bm }} -v

      - name: Verify WebEngineTests Binary
        run: |
          test -f SkylarkManager/bin/WebEngineTests
          ls -lh SkylarkManager/bin/WebEngineTests
          file SkylarkManager/bin/WebEngineTests

      - name: Run Engine Fence Tests (${{ matrix.bm }})
        run: |
          cd SkylarkManager
          ./bin/WebEngineTests

      - name: Build SiteCli (${{ matrix.bm }})
        run: |
          cd SkylarkManager
          uppbuilder SiteCli -m ${{ matrix.bm }} -a ../CompanySkylark/uppsrc -v

      - name: Verify SiteCli Binary
        run: |
          test -f SkylarkManager/bin/SiteCli
          ls -lh SkylarkManager/bin/SiteCli
          file SkylarkManager/bin/SiteCli

  agentlab:
    name: AgentLab scenarios (ubuntu-latest - clang++)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SkylarkManager
        uses: actions/checkout@v4
        with:
          path: SkylarkManager

      - name: Checkout BazaarCore
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/BazaarCore
          path: BazaarCore

      - name: Checkout UppBootstrap
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBootstrap
          path: UppBootstrap

      - name: Checkout UppBuilder
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBuilder
          path: UppBuilder

      - name: Checkout CompanySkylark (Company composed module)
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/CompanySkylark
          path: CompanySkylark

      - name: Checkout SuperIntelligence
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/SuperIntelligence
          path: SuperIntelligence

      - name: Checkout AgentIPC (client and node, stdlib Python)
        uses: actions/checkout@v4
        with:
          repository: OuluLinux/AgentIPC
          path: AgentIPC

      - name: Checkout Upstream U++ (ultimatepp)
        uses: actions/checkout@v4
        with:
          repository: ultimatepp/ultimatepp
          path: ultimatepp
          sparse-checkout: |
            mkumk_blitz.cpp
            Makefile
            uppsrc/**
          sparse-checkout-cone-mode: false

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang g++ libbz2-dev libexpat1-dev libfontconfig1-dev libfreetype-dev liblz4-dev liblzma-dev libpcre2-dev libpng-dev libjpeg-dev libssl-dev libx11-dev libxcb1-dev libxxhash-dev libzstd-dev zlib1g-dev libgtk-3-dev libnotify-dev

      - name: Bootstrap umk with UppBootstrap
        env:
          CXX: clang++
        run: |
          cd UppBootstrap
          chmod +x ./bootstrap.sh
          ./bootstrap.sh --upp-root "$GITHUB_WORKSPACE/ultimatepp" --verbose
          echo "$GITHUB_WORKSPACE/ultimatepp/bin" >> "$GITHUB_PATH"

      - name: Bootstrap UppBuilder
        env:
          CXX: clang++
        run: |
          cd UppBuilder
          chmod +x ./bootstrap.sh
          ./bootstrap.sh
          echo "$GITHUB_WORKSPACE/UppBuilder" >> "$GITHUB_PATH"

      - name: Materialize Patched BazaarCore Assembly
        run: |
          cd BazaarCore
          uppbuilder --apply-patches --upstream "$GITHUB_WORKSPACE/ultimatepp/uppsrc" --applied-patches "$GITHUB_WORKSPACE/BazaarCore/patched-uppsrc" -v

      - name: Build ManagerSkylark and SiteCli (CLANG)
        run: |
          cd SkylarkManager
          uppbuilder ManagerSkylark -m CLANG -a ../CompanySkylark/uppsrc -v
          uppbuilder SiteCli -m CLANG -a ../CompanySkylark/uppsrc -v
          test -f bin/ManagerSkylark
          test -f bin/SiteCli

      - name: Prepare AgentIPC node (plain server, CI home)
        run: |
          H="$RUNNER_TEMP/agentipc-ci"
          mkdir -p "$H"
          PW=$(openssl rand -hex 24)
          echo "MANAGERSKYLARK_AGENTIPC_PASSWORD=$PW" >> "$GITHUB_ENV"
          export MANAGERSKYLARK_AGENTIPC_PASSWORD="$PW"
          cat > "$H/config.json" <<'JSON'
          {"node": "ci-authority", "authority": "ci-authority", "control_port": 7421, "listen": 7440,
           "allow": ["127.0.0.1"], "peers": [], "shell": {"enabled": false, "users": []}, "targets": []}
          JSON
          AG="python3 $GITHUB_WORKSPACE/AgentIPC/bin/agentipc --home $H"
          $AG account add channels --password-env MANAGERSKYLARK_AGENTIPC_PASSWORD
          $AG server create skylark
          nohup python3 "$GITHUB_WORKSPACE/AgentIPC/bin/agentipc" --home "$H" node run > "$H/node.log" 2>&1 &
          echo $! > "$H/node.pid"
          for i in $(seq 60); do
            if (echo > /dev/tcp/127.0.0.1/7440) 2>/dev/null; then break; fi
            sleep 0.5
          done
          (echo > /dev/tcp/127.0.0.1/7440) 2>/dev/null || { cat "$H/node.log"; exit 1; }
          python3 "$GITHUB_WORKSPACE/AgentIPC/bin/agentipc" vs --direct 127.0.0.1:7440 --server skylark --user channels --password-env MANAGERSKYLARK_AGENTIPC_PASSWORD say SKYLARK-MANAGER "ci seed"

      - name: Run AgentLab scenarios (CI node)
        env:
          AGENTLAB_AGENTIPC_PYTHON: python3
          AGENTLAB_AGENTIPC_CLIENT: ${{ github.workspace }}/AgentIPC/bin/agentipc
          AGENTLAB_AGENTIPC_HOME: ${{ runner.temp }}/agentipc-ci
        run: |
          cd SkylarkManager
          python3 upptst/AgentLab/agentlab.py --binary bin/ManagerSkylark --site-cli bin/SiteCli \
            --scenario upptst/AgentLab/scenarios/privatehub-issues.json \
            --scenario upptst/AgentLab/scenarios/taskfoundry-submit.json \
            --scenario upptst/AgentLab/scenarios/channels-view.json \
            --scenario upptst/AgentLab/scenarios/financials-view.json | tee agentlab.log
          for s in privatehub-issues taskfoundry-submit channels-view financials-view; do
            grep -q "^scenario $s: PASS" agentlab.log || { echo "missing PASS for $s"; exit 1; }
          done

      - name: Stop AgentIPC node
        if: always()
        run: |
          H="$RUNNER_TEMP/agentipc-ci"
          if [ -f "$H/node.pid" ]; then kill "$(cat "$H/node.pid")" 2>/dev/null || true; fi
          cat "$H/node.log" 2>/dev/null || true

  build-windows:
    name: Windows (windows-latest - MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout SkylarkManager
        uses: actions/checkout@v4
        with:
          path: SkylarkManager

      - name: Checkout BazaarCore
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/BazaarCore
          path: BazaarCore

      - name: Checkout UppBootstrap
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBootstrap
          path: UppBootstrap

      - name: Checkout UppBuilder
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBuilder
          path: UppBuilder

      - name: Checkout CompanySkylark (Company composed module)
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/CompanySkylark
          path: CompanySkylark

      - name: Checkout SuperIntelligence
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/SuperIntelligence
          path: SuperIntelligence

      - name: Checkout Upstream U++ (ultimatepp)
        uses: actions/checkout@v4
        with:
          repository: ultimatepp/ultimatepp
          path: ultimatepp
          sparse-checkout: |
            mkumk_blitz.cpp
            Makefile
            uppsrc/**
          sparse-checkout-cone-mode: false

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Dependencies via vcpkg (Windows)
        shell: cmd
        env:
          VCPKG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vcpkg install openssl:x64-windows zlib:x64-windows bzip2:x64-windows liblzma:x64-windows lz4:x64-windows zstd:x64-windows xxhash:x64-windows pcre2:x64-windows libpng:x64-windows libjpeg-turbo:x64-windows
          vcpkg integrate install
          copy /y "C:\vcpkg\installed\x64-windows\lib\z.lib" "C:\vcpkg\installed\x64-windows\lib\zs.lib"
          if exist "C:\vcpkg\installed\x64-windows\debug\lib\zd.lib" (
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\zd.lib" "C:\vcpkg\installed\x64-windows\debug\lib\zs.lib"
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\zd.lib" "C:\vcpkg\installed\x64-windows\debug\lib\z.lib"
          )
          copy /y "C:\vcpkg\installed\x64-windows\lib\pcre2-8.lib" "C:\vcpkg\installed\x64-windows\lib\pcre2.lib"
          if exist "C:\vcpkg\installed\x64-windows\debug\lib\pcre2-8d.lib" (
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\pcre2-8d.lib" "C:\vcpkg\installed\x64-windows\debug\lib\pcre2.lib"
          )
          copy /y "C:\vcpkg\installed\x64-windows\lib\libpng16.lib" "C:\vcpkg\installed\x64-windows\lib\png.lib"
          if exist "C:\vcpkg\installed\x64-windows\debug\lib\libpng16d.lib" (
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\libpng16d.lib" "C:\vcpkg\installed\x64-windows\debug\lib\png.lib"
          )
          echo INCLUDE=C:\vcpkg\installed\x64-windows\include;%INCLUDE%>>%GITHUB_ENV%
          echo LIB=C:\vcpkg\installed\x64-windows\lib;C:\vcpkg\installed\x64-windows\debug\lib;%LIB%>>%GITHUB_ENV%
          echo C:\vcpkg\installed\x64-windows\bin>>%GITHUB_PATH%

      - name: Bootstrap umk with UppBootstrap
        shell: cmd
        run: |
          cd UppBootstrap
          call bootstrap.cmd --upp-root "%GITHUB_WORKSPACE%\ultimatepp" --verbose
          echo %GITHUB_WORKSPACE%\ultimatepp\bin>>%GITHUB_PATH%

      - name: Bootstrap UppBuilder
        shell: cmd
        run: |
          cd UppBuilder
          call bootstrap.bat
          echo %GITHUB_WORKSPACE%\UppBuilder>>%GITHUB_PATH%

      - name: Verify umk and UppBuilder
        shell: cmd
        run: |
          umk.exe
          uppbuilder.exe --version
          uppbuilder.exe --help

      - name: Materialize Patched BazaarCore Assembly
        shell: cmd
        run: |
          cd BazaarCore
          uppbuilder.exe --apply-patches --upstream "%GITHUB_WORKSPACE%\ultimatepp\uppsrc" --applied-patches "%GITHUB_WORKSPACE%\BazaarCore\patched-uppsrc" -v

      - name: Build ManagerSkylark (MSVC)
        shell: cmd
        run: |
          cd SkylarkManager
          uppbuilder.exe ManagerSkylark -m MSVS22x64 -a "%GITHUB_WORKSPACE%\CompanySkylark\uppsrc" -v

      - name: Verify ManagerSkylark Binary
        shell: cmd
        run: |
          if not exist "SkylarkManager\bin\ManagerSkylark.exe" exit /b 1
          dir "SkylarkManager\bin\ManagerSkylark.exe"

      - name: Run Automated ManagerSkylark Tests (Windows)
        shell: cmd
        run: |
          if exist "C:\vcpkg\installed\x64-windows\bin" copy /y "C:\vcpkg\installed\x64-windows\bin\*.dll" SkylarkManager\bin\
          cd SkylarkManager
          bin\ManagerSkylark.exe --test

      - name: Build SkylarkGuiExample (MSVC)
        shell: cmd
        run: |
          cd SkylarkManager
          uppbuilder.exe examples/SkylarkGuiExample -m MSVS22x64 -v

      - name: Verify SkylarkGuiExample Binary
        shell: cmd
        run: |
          if not exist "SkylarkManager\bin\SkylarkGuiExample.exe" exit /b 1
          dir "SkylarkManager\bin\SkylarkGuiExample.exe"

      - name: Build WebShowcase (MSVC)
        shell: cmd
        run: |
          cd SkylarkManager
          uppbuilder.exe examples/WebShowcase -m MSVS22x64 -v

      - name: Verify WebShowcase Binary
        shell: cmd
        run: |
          if not exist "SkylarkManager\bin\WebShowcase.exe" exit /b 1
          dir "SkylarkManager\bin\WebShowcase.exe"

      # Compile coverage only: the fence-test fixtures include POSIX shell
      # scripts (fake gh, git invocations), so the run step is POSIX-only.
      - name: Build WebEngineTests (MSVC)
        shell: cmd
        run: |
          cd SkylarkManager
          uppbuilder.exe WebEngineTests -m MSVS22x64 -v
